{
    "app-id": "org.gnome.gitlab.dqpb.GMetronome",
    "runtime": "org.gnome.Platform",
    "runtime-version": "master",
    "sdk": "org.gnome.Sdk",
    "command": "gmetronome",
    "finish-args": [
        "--socket=wayland",
        "--socket=fallback-x11",
        "--share=ipc",
        "--socket=pulseaudio"
    ],
    "cleanup": [
        "/include",
        "/lib/pkgconfig",
        "/share/aclocal",
        "/share/devhelp",
        "/share/doc",
        "/share/gc",
        "/share/info",
        "/share/man",
        "/share/pkgconfig",
        "*.la",
        "*.a"
    ],
    "modules": [
        {
            "name": "mm-common",
            "buildsystem": "meson",
            "sources": [
                {
                    "type": "archive",
                    "url": "https://download.gnome.org/sources/mm-common/1.0/mm-common-1.0.8.tar.xz",
                    "sha256": "b189ee636e839d12c00dabefae099fd488ab2358dec24d264761c011950b02a9"
                }
            ],
            "cleanup": [
                "*"
            ]
        },
        {
            "name": "sigc++-2",
            "config-opts": [
                "--disable-documentation"
            ],
            "cleanup": [
                "/lib/sigc++-2.0"
            ],
            "sources": [
                {
                    "type": "archive",
                    "url": "https://download.gnome.org/sources/libsigc++/2.12/libsigc++-2.12.1.tar.xz",
                    "sha256": "a9dbee323351d109b7aee074a9cb89ca3e7bcf8ad8edef1851f4cf359bd50843"
                }
            ]
        },
        {
            "name": "cairomm",
            "config-opts": [
                "--disable-documentation"
            ],
            "cleanup": [
                "/lib/cairomm-1.0"
            ],
            "sources": [
                {
                    "type": "archive",
                    "url": "https://www.cairographics.org/releases/cairomm-1.14.6.tar.xz",
                    "sha256": "7e0d5c7f29175d573a03ab5c45aef63f48dd91a5caf335a404cd763e4b7cea4a"
                }
            ]
        },
        {
            "name": "glibmm",
            "cleanup": [
                "/lib/glibmm-2.4",
                "/lib/giomm-2.4"
            ],
            "buildsystem": "meson",
            "config-opts": [
                "-Dbuild-documentation=false",
                "-Dbuild-examples=false"
            ],
            "sources": [
                {
                    "type": "archive",
                    "url": "https://download.gnome.org/sources/glibmm/2.66/glibmm-2.66.9.tar.xz",
                    "sha256": "5a026e5602085307c7dcb72b71b07261c40f80914277bef5f8d7f2ecab739bec"
                }
            ]
        },
        {
            "name": "pangomm",
            "buildsystem": "meson",
            "config-opts": [
                "-Dbuild-documentation=false"
            ],
            "cleanup": [
                "/lib/pangomm-1.4"
            ],
            "sources": [
                {
                    "type": "archive",
                    "url": "https://download.gnome.org/sources/pangomm/2.46/pangomm-2.46.5.tar.xz",
                    "sha256": "38ca0b050b065de4e3da0c182df657437757063bbf0c4b6c9567ddba019b1d68"
                }
            ]
        },
        {
            "name": "atkmm",
            "buildsystem": "meson",
            "config-opts": [
                "-Dbuild-documentation=false"
            ],
            "cleanup": [
                "/lib/atkmm-1.6"
            ],
            "sources": [
                {
                    "type": "archive",
                    "url": "https://download.gnome.org/sources/atkmm/2.28/atkmm-2.28.5.tar.xz",
                    "sha256": "ae449192a582a2582a95e0602b15d792bbd639e836339b81ef916aa87540ac5c"
                }
            ]
        },
        {
            "name" : "gtkmm",
            "buildsystem": "meson",
            "config-opts": [
                "-Dbuild-documentation=false",
                "-Dbuild-demos=false",
                "-Dbuild-tests=false"
            ],
            "cleanup": [
                "/lib/gtkmm-3.0",
                "/lib/gdkmm-3.0"
            ],
            "sources" : [
                {
                    "type" : "archive",
                    "url" : "https://download.gnome.org/sources/gtkmm/3.24/gtkmm-3.24.9.tar.xz",
                    "sha256" : "30d5bfe404571ce566a8e938c8bac17576420eb508f1e257837da63f14ad44ce"
                }
            ]
        },
        {
            "name": "gmetronome",
            "buildsystem": "autotools",
            "build-options": {
                "cppflags": "-DNDEBUG"
            },
            "config-opts": [
                "--with-pulseaudio",
                "--without-alsa",
                "--without-oss"
            ],
            "sources": [
                {
                    "type": "git",
                    "url": "https://gitlab.gnome.org/dqpb/gmetronome.git",
                    "branch": "main"
                }
            ]
        }
    ]
}
